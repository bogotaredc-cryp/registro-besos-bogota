<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Besos x Bogotá</title>
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <video id="bg-video" autoplay muted loop playsinline>
        <source src="video/fondo.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>


    <div class="card">
        <div style="display: flex;" class="logos">
            <img src="logosencillo.png" class="logo">
        </div>


        <h1>Besos x Bogotá</h1>

        <p class="subtitle">

            Antes de continuar con tu inscripción verifica si tu documento ya se encuentra registrado.

        </p>

        <div class="input-group">

            <label>Documento de identidad</label>

            <input id="documento" type="text" placeholder="Ingrese su documento">

        </div>

        <button id="verificar">

            Verificar inscripción

        </button>

        <div id="mensaje"></div>

        <button id="continuar">

            Continuar inscripción

        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
